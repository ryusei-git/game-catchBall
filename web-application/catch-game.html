<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#EDE7F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="キャッチ！">
<title>キャッチ！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3A3050;
  /* カード(#FFFDFA)上でも かべ(#EDE7F5)上でも コントラスト比 4.5:1 を満たす濃さ。
     前の #7E7199 は 4.39:1 / 3.68:1 でわずかに足りなかった */
  --ink-soft:#6C5F8B;
  --wall:#EDE7F5;
  --card:#FFFDFA;
  --line:#DED2F0;
  --sun:#FFC24B;
  --sun-deep:#E39D14;
  --mint:#57C9A8;
  --mint-deep:#399C80;
  --berry:#F2637E;
  --berry-deep:#CE4260;
  --r:22px;
  --tap:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  position:fixed;inset:0;overflow:hidden;
  background:var(--wall);
  color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic Medium',system-ui,sans-serif;
  font-weight:800;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
#app{position:absolute;inset:0;max-width:560px;margin:0 auto;overflow:hidden}

/* ---------- よこ向きの あんない ----------
   スマホを よこにすると レイアウトが つぶれるので、
   縦に戻すよう おねがいする画面を かぶせる。
   max-height の条件は、PCの横長ウィンドウで出てしまうのを防ぐため
   （スマホの横向き＝画面が低い、だけを対象にする） */
#rotate{
  position:fixed;inset:0;z-index:100;display:none;
  background:var(--wall);color:var(--ink);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:20px;text-align:center;
}
#rotate p{font-size:clamp(19px,5vw,26px);line-height:1.4}
#rotate svg{animation:tilt 2.2s ease-in-out infinite}
@keyframes tilt{
  0%,55%,100%{transform:rotate(-90deg)}
  25%,45%{transform:rotate(0deg)}
}
@media (prefers-reduced-motion:reduce){ #rotate svg{animation:none} }
@media (orientation:landscape) and (max-height:520px){ #rotate{display:flex} }

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px);
  opacity:0;transform:translateY(14px) scale(.985);
  /* visibility も切る。pointer-events:none だけだと、子孫が pointer-events:auto を
     指定した時（#btnQuit）に復活してしまい、隠れている画面のボタンが
     手前でタップを奪う。Tab キーで隠れた画面のボタンに入るのも防げる。
     フェードアウトを見せてから消すため、visibility だけ .26s 遅らせる。 */
  pointer-events:none;visibility:hidden;
  transition:opacity .26s ease,transform .26s ease,visibility 0s linear .26s;
}
.screen.on{
  opacity:1;transform:none;pointer-events:auto;visibility:visible;
  transition:opacity .26s ease,transform .26s ease,visibility 0s;
}
#s-game{padding:0}

/* ---------- paper buttons ---------- */
.btn{
  font:inherit;font-weight:800;color:var(--ink);
  border:none;border-radius:var(--r);
  background:var(--card);
  box-shadow:0 5px 0 var(--line);
  min-height:var(--tap);padding:14px 22px;
  font-size:clamp(19px,5.2vw,24px);
  cursor:pointer;transition:transform .07s ease,box-shadow .07s ease;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn-primary{background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);color:#4A3200}
.btn-primary:active{box-shadow:0 1px 0 var(--sun-deep)}
.btn-mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-deep);color:#093B2D}
.btn-mint:active{box-shadow:0 1px 0 var(--mint-deep)}
.btn-big{font-size:clamp(24px,7vw,32px);min-height:76px;border-radius:26px}
.btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.icon-btn{
  width:48px;height:48px;min-height:48px;padding:0;border-radius:16px;
  font-size:20px;flex:0 0 auto;
}

/* ---------- home ---------- */
.brand{display:flex;align-items:baseline;justify-content:center;gap:8px;letter-spacing:.02em}
.brand h1{font-size:clamp(34px,10vw,46px);line-height:1}
/* 遊びかたを伝える唯一の一文なので、読みとばされない大きさ・濃さにする */
.tagline{
  text-align:center;color:var(--ink);font-weight:800;
  font-size:clamp(17px,4.6vw,20px);margin-top:clamp(22px,8vw,36px);letter-spacing:.01em;
  line-height:1.4;
}
/* 狭い画面では「ゆびで うごかして／まるを あつめよう」と文節で折り返す。
   inline-block にすると span の内側では折り返されないので、
   「あつめよ／う」のような1文字だけ落ちる折り返しを防げる。 */
.tagline span{display:inline-block}

.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0}
canvas.preview{
  width:100%;max-width:340px;aspect-ratio:1/.92;
  border-radius:30px;box-shadow:4px 6px 0 rgba(58,48,80,.13);
  display:block;
}
/* 画面の下端から少し浮かせる。vh 基準にすることで、
   縦の短い端末では余白を控えめにしてキャラ絵が潰れすぎないようにする */
.home-actions{display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(8px,4.5vh,40px)}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.spacer{flex:1}

.coin-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--card);border-radius:999px;padding:9px 18px 9px 12px;
  box-shadow:0 4px 0 var(--line);font-size:20px;
}
.coin-chip .c{
  width:24px;height:24px;border-radius:50%;
  background:var(--sun);box-shadow:inset 0 0 0 4px var(--sun-deep);
}

/* ---------- level select ---------- */
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
/* 見出しだけ縮ませる。ボタンとコインは縮めない（狭い端末でも押せる大きさを保つ） */
.head h2{font-size:clamp(24px,6.4vw,30px);min-width:0;white-space:nowrap}
.head .icon-btn,.head .coin-chip{flex:0 0 auto}
.head .spacer{min-width:0}
.grid{
  /* 30ステージあるので、中央よせではなく上づめ＋スクロールにする */
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  overflow-y:auto;align-content:start;padding:4px 0 8px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
/* むずかしさの区分け見出し（3列ぶち抜き） */
.grid .tier{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin-top:6px}
.grid .tier:first-child{margin-top:0}
.grid .tier b{font-size:17px}
.grid .tier span{font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.grid .tier i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.tile{
  background:var(--card);border:none;border-radius:20px;
  box-shadow:0 5px 0 var(--line);
  aspect-ratio:1/1.06;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  font:inherit;color:var(--ink);cursor:pointer;
  transition:transform .07s ease,box-shadow .07s ease;
}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile .n{font-size:clamp(28px,8vw,34px);line-height:1}
.tile .st{display:flex;gap:2px;height:14px}
.tile.done{background:#FFF4DC;box-shadow:0 5px 0 #F0DCAE}
.tile.next{background:var(--sun);color:#4A3200;box-shadow:0 5px 0 var(--sun-deep),0 0 0 0 rgba(255,194,75,.85);animation:ring 1.8s ease-out infinite}
.tile.next:active{animation:none}
@keyframes ring{
  0%{box-shadow:0 5px 0 var(--sun-deep),0 0 0 0 rgba(255,194,75,.8)}
  70%,100%{box-shadow:0 5px 0 var(--sun-deep),0 0 0 14px rgba(255,194,75,0)}
}
.tile:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.pip{width:12px;height:12px;display:block}

/* ---------- shop ---------- */
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{
  flex:1;font:inherit;font-size:clamp(14px,4.1vw,17px);border:none;border-radius:16px;
  padding:13px 2px;background:var(--card);color:var(--ink-soft);white-space:nowrap;
  box-shadow:0 4px 0 var(--line);cursor:pointer;min-height:48px;
}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #241C35}
.shop-grid{
  /* 要素が増えても中だけスクロールする。
     min-height:0 が無いと、flex の子は中身の高さまで伸びてスクロールしなくなる */
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:11px;
  overflow-y:auto;align-content:start;padding-bottom:10px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.item{
  background:var(--card);border:none;border-radius:18px;
  box-shadow:0 5px 0 var(--line);padding:9px 6px 8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font:inherit;color:var(--ink);cursor:pointer;
  transition:transform .07s ease,box-shadow .07s ease;
}
.item:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.item canvas{width:100%;max-width:72px;aspect-ratio:1;border-radius:14px;display:block}
.item .nm{font-size:13px;font-weight:500;color:var(--ink-soft)}
.item .pz{font-size:15px;display:flex;align-items:center;gap:4px}
.item .pz i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 3px var(--sun-deep);display:block}
.item.on{background:var(--mint);box-shadow:0 5px 0 var(--mint-deep)}
.item.on .nm{color:#0C4234}
.item.owned .pz{color:var(--mint-deep)}
.item.poor{opacity:.55}
.item.shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* ---------- あそびかた ---------- */
.help-body{
  flex:1;min-height:0;overflow-y:auto;padding-bottom:10px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.help-h{font-size:19px;margin:4px 2px 9px;color:var(--ink)}
.help-h:not(:first-child){margin-top:20px}
.help-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border-radius:18px;padding:10px 14px;
  box-shadow:0 4px 0 var(--line);margin-bottom:9px;
}
.help-row canvas{width:46px;height:46px;flex:0 0 auto}
.help-row .t{flex:1;min-width:0}
.help-row .t b{display:block;font-size:17px}
/* せまい画面で折り返す時、単語のとちゅうで切らず文節の区切り（空白）で折る */
.help-row .t span{
  display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-top:1px;
  word-break:keep-all;overflow-wrap:break-word;
}
.help-row .v{
  font-size:15px;white-space:nowrap;flex:0 0 auto;
  background:var(--sun);color:#4A3200;border-radius:999px;padding:5px 11px;
}
.help-row .v.bad{background:var(--berry);color:#fff}
.help-row .v.plain{background:var(--line);color:var(--ink)}
.help-row .ic{
  width:46px;height:46px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;gap:2px;
}
.help-row .ic svg{width:24px;height:24px}

.shop-preview{display:flex;align-items:center;gap:14px;margin-bottom:2px}
.shop-preview canvas{width:104px;height:104px;border-radius:24px;box-shadow:3px 5px 0 rgba(58,48,80,.13);flex:0 0 auto}
.shop-preview .msg{font-size:15px;font-weight:500;color:var(--ink-soft);line-height:1.5}

/* ---------- game ---------- */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{
  position:absolute;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0;
  pointer-events:none;display:flex;flex-direction:column;gap:9px;
}
.hud-row{display:flex;align-items:center;gap:10px}
.hearts{display:flex;gap:5px}
.hearts svg{width:27px;height:27px;transition:transform .2s ease,opacity .2s ease}
.hearts svg.off{opacity:.25;transform:scale(.72)}
.bar{
  flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 3px rgba(58,48,80,.13);overflow:hidden;
}
.bar > i{display:block;height:100%;width:100%;border-radius:999px;background:var(--mint);transition:width .12s linear}
.bar.low > i{background:var(--berry)}
.goal{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.82);border-radius:999px;padding:7px 16px 7px 11px;
  box-shadow:0 3px 0 rgba(58,48,80,.12);
}
.goal .gbar{flex:1;height:15px;border-radius:999px;background:rgba(58,48,80,.13);overflow:hidden}
.goal .gbar > i{display:block;height:100%;width:0;border-radius:999px;background:var(--sun);transition:width .18s ease}
.goal .num{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* いま効いている アイテムの効果 */
.fx{display:flex;gap:7px;flex-wrap:wrap}
.fx span{
  font-size:14px;border-radius:999px;padding:5px 12px;color:#fff;
  box-shadow:0 3px 0 rgba(58,48,80,.15);
}
.fx .s{background:#57C9A8}
.fx .d{background:#B79BEA}
.fx .m{background:#F2637E}
.hud .icon-btn{background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(58,48,80,.14)}
/* .hud は pointer-events:none（タッチをキャンバスに通すため）なので、
   HUD 上のボタンだけ押せるように戻す。ただし「ゲーム画面が出ている時」に限定する。
   限定しないと、隠れているゲーム画面のボタンが最前面に居座り、
   他画面の同じ位置のボタン（おとボタン）のタップを奪ってしまう。 */
#s-game.on .hud .icon-btn{pointer-events:auto}

/* ---------- overlay ---------- */
.ov{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(58,48,80,.42);backdrop-filter:blur(3px);z-index:5;
}
.ov.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov-card{
  background:var(--card);border-radius:32px;padding:22px 20px 20px;
  width:100%;max-width:360px;text-align:center;
  box-shadow:0 10px 0 rgba(58,48,80,.22);
  animation:pop .32s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop{from{transform:scale(.8) translateY(16px)}to{transform:none}}
.ov-card canvas{width:112px;height:112px;margin:0 auto;display:block}
.ov-title{font-size:clamp(26px,7.4vw,32px);margin-top:4px}
.ov-stars{display:flex;justify-content:center;gap:7px;margin:11px 0 4px}
.ov-stars svg{width:40px;height:40px}
.ov-coins{font-size:19px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:4px}
.ov-coins i{width:19px;height:19px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 4px var(--sun-deep);display:block}
.gift{
  background:#FFF2DA;border-radius:18px;padding:11px 12px;margin:12px 0 2px;
  display:flex;align-items:center;gap:11px;text-align:left;
  animation:pop .4s .15s backwards cubic-bezier(.2,1.5,.4,1);
}
.gift canvas{width:52px;height:52px;flex:0 0 auto;border-radius:13px;margin:0}
.gift .t{font-size:16px;line-height:1.45}
.gift .t b{display:block;font-size:18px}
.ov-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.06s !important}
}
@media (max-height:620px){
  .btn-big{min-height:64px}
  canvas.preview{max-width:250px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ========== HOME ========== -->
  <section class="screen" id="s-home">
    <div class="top-row">
      <div class="coin-chip"><span class="c"></span><span id="homeCoins">0</span></div>
      <span class="spacer"></span>
      <button class="btn icon-btn" id="btnHelp" aria-label="あそびかた">？</button>
      <button class="btn icon-btn snd" aria-label="おと">🔊</button>
    </div>
    <div class="brand"><h1>キャッチ！</h1></div>
    <p class="tagline"><span>ゆびで うごかして</span> <span>まるを あつめよう</span></p>
    <div class="stage-wrap"><canvas class="preview" id="homeCv"></canvas></div>
    <div class="home-actions">
      <button class="btn btn-primary btn-big" id="btnPlay">あそぶ</button>
      <button class="btn btn-mint" id="btnShop">きせかえ</button>
    </div>
  </section>

  <!-- ========== LEVELS ========== -->
  <section class="screen" id="s-levels">
    <div class="head">
      <button class="btn icon-btn" id="btnLvBack" aria-label="もどる">←</button>
      <h2>ステージ</h2>
      <span class="spacer"></span>
      <div class="coin-chip"><span class="c"></span><span id="lvCoins">0</span></div>
      <button class="btn icon-btn snd" aria-label="おと">🔊</button>
    </div>
    <div class="grid" id="lvGrid"></div>
  </section>

  <!-- ========== SHOP ========== -->
  <section class="screen" id="s-shop">
    <div class="head">
      <button class="btn icon-btn" id="btnShopBack" aria-label="もどる">←</button>
      <h2>きせかえ</h2>
      <span class="spacer"></span>
      <div class="coin-chip"><span class="c"></span><span id="shopCoins">0</span></div>
      <button class="btn icon-btn snd" aria-label="おと">🔊</button>
    </div>
    <div class="shop-preview">
      <canvas id="shopCv" width="208" height="208"></canvas>
      <p class="msg" id="shopMsg">すきなものを えらんでね。<br>コインが たりると かえるよ。</p>
    </div>
    <!-- タブは CATEGORIES から buildTabs() が作る -->
    <div class="tabs" id="shopTabs"></div>
    <div class="shop-grid" id="shopGrid"></div>
  </section>

  <!-- ========== HELP（あそびかた） ========== -->
  <section class="screen" id="s-help">
    <div class="head">
      <button class="btn icon-btn" id="btnHelpBack" aria-label="もどる">←</button>
      <h2>あそびかた</h2>
      <span class="spacer"></span>
      <button class="btn icon-btn snd" aria-label="おと">🔊</button>
    </div>
    <div class="help-body" id="helpBody"></div>
  </section>

  <!-- ========== GAME ========== -->
  <section class="screen" id="s-game">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-row">
        <div class="hearts" id="hearts"></div>
        <div class="bar" id="timeBar"><i></i></div>
        <button class="btn icon-btn snd" aria-label="おと">🔊</button>
        <button class="btn icon-btn" id="btnQuit" aria-label="やめる">✕</button>
      </div>
      <div class="fx" id="fxRow" hidden></div>
      <div class="goal">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5 6.2 20.55l1.1-6.5-4.7-4.6 6.5-.95z" fill="#FFC24B" stroke="#E39D14" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <div class="gbar"><i id="goalFill"></i></div>
        <span class="num" id="goalNum">0 / 0</span>
      </div>
    </div>

    <div class="ov" id="ov">
      <div class="ov-card">
        <canvas id="ovCv" width="224" height="224"></canvas>
        <div class="ov-title" id="ovTitle"></div>
        <div class="ov-stars" id="ovStars"></div>
        <div class="ov-coins"><i></i><span id="ovCoins">0</span></div>
        <div class="gift" id="ovGift" hidden>
          <canvas id="giftCv" width="104" height="104"></canvas>
          <div class="t"><b id="giftName"></b>プレゼント！ きせかえで つかえるよ</div>
        </div>
        <div class="ov-btns">
          <button class="btn btn-primary" id="ovMain">つぎへ</button>
          <button class="btn" id="ovHome">ホーム</button>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- よこ向きの時の あんない。CSSだけで出し入れするので、
     JS が止まっていても かならず出る -->
<div id="rotate" aria-live="polite">

<script>
'use strict';

/* ============================================================
   0. かんたんな保存（localStorage が使えない環境では自動でメモリに）
   ============================================================ */
const Store = (() => {
  const mem = {};
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { if(ok) localStorage.setItem(k,v); else mem[k]=v; } catch(e){ mem[k]=v; } }
  };
})();

/** レベルごとのパラメータ。
 *  落下速度は「画面の高さの何割 / 秒」で定義しているので、
 *  端末の画面サイズが変わっても体感難易度が変わらない。 */
function levelParams(n, assist){
  const t  = n - 1;
  const ex = Math.max(0, n - 20);   // 「むずかしい」帯で どれだけ上か
  let p = {
    // 後半は もちじかん も 短くして、あせりを出す
    time:  Math.round(45 - Math.max(0, t - 9) * 0.55 - ex * 0.4),
    speed: 0.28 + Math.min(t, 19) * 0.0185 + ex * 0.018,
    spawn: 1.10 - Math.min(t, 19) * 0.029 - ex * 0.021,
    bad:   n <= 2 ? 0 : Math.min(0.36 + ex * 0.006, 0.09 + (t - 2) * 0.017),
    // ---- じゃま ----
    wind:   n >= 13 ? Math.min(0.16, 0.045 + (n - 13) * 0.008) : 0,  // よこに ながされる
    clouds: n >= 16 ? Math.min(4, 1 + Math.floor((n - 16) / 2)) : 0, // くもで かくれる
    burst:  n >= 19 ? Math.min(0.42, 0.28 + ex * 0.015) : 0,         // まとめて おちてくる
    // ---- 「むずかしい」帯だけ。速さではなく“正確さ”を要求する ----
    basket: Math.max(0.62, 1 - ex * 0.038),                          // かごが せまくなる
    homing: n >= 24 ? Math.min(0.45, 0.15 + (n - 24) * 0.05) : 0     // バツが おいかけてくる
  };
  if(assist){
    // 3回つまずいたら、こっそりやさしくする（画面には出さない）
    p.speed  *= 0.82;
    p.bad    *= 0.50;
    p.wind   *= 0.5;
    p.clouds  = Math.max(0, p.clouds - 1);
    p.burst   = 0;
    p.homing *= 0.40;
    p.basket  = Math.min(1, p.basket + 0.14);
  }
  // 目標てんは「全部とれた時の点」の何割かで決める。
  // こうしておくと、アイテムを足しても難易度が勝手に壊れない。
  // 21以降は この割合を上げず、かごの狭さ・追尾で難しくしている
  // （計算で詰ませるのではなく、腕前で差がつくようにするため）
  const avail = p.time * ((1 - p.bad) / p.spawn) * ptsPerGood(n);
  const need  = n <= 20 ? Math.min(0.86, 0.16 + t * 0.037) : 0.86;
  p.goal = Math.max(5, Math.round(avail * need * (assist ? 0.78 : 1)));
  return p;
}

const DEFAULT_STATE = {

  stars: {},            // level -> 1..3
  fails: {},            // level -> 連続失敗数

  // カテゴリを足しても、ここを書き直す必要はない。
  owned: {},
  equip: {},
  sound: true,
  tutorialDone: false,
  giftGiven: false
};
CATEGORIES.forEach(g => {
  DEFAULT_STATE.owned[g.key] = [g.items[0].id];
  DEFAULT_STATE.equip[g.key] = g.items[0].id;
});
let state = load();

function load(){
  try {
    const raw = Store.get('catch.save');
    if(!raw) return structuredClone(DEFAULT_STATE);
    const s = JSON.parse(raw);
    const d = structuredClone(DEFAULT_STATE);
    return Object.assign(d, s, {
      owned: Object.assign(d.owned, s.owned || {}),
      equip: Object.assign(d.equip, s.equip || {})
    });
  } catch(e){ return structuredClone(DEFAULT_STATE); }
}
function save(){ try { Store.set('catch.save', JSON.stringify(state)); } catch(e){} }

/* ============================================================
   3. おと（WebAudio）
   ============================================================ */
const Sfx = (() => {
  let ctx = null;
  function ac(){
    if(!ctx){ const A = window.AudioContext || window.webkitAudioContext; if(A) ctx = new A(); }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, delay){
    if(!state.sound) return;
    const c = ac(); if(!c) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol || .16, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  return {
    unlock(){ ac(); },
    catch_(){ tone(660, .13, 'sine', .14); tone(990, .11, 'sine', .09, .05); },
    star(){ tone(784, .1, 'triangle', .14); tone(1175, .16, 'triangle', .12, .07); },
    coin(){ tone(1320, .09, 'square', .07); tone(1760, .12, 'square', .05, .05); },
    hit(){ tone(180, .22, 'sawtooth', .12); tone(120, .26, 'sawtooth', .1, .04); },
    slow(){ tone(520, .2, 'sine', .1); tone(390, .3, 'sine', .09, .1); },
    clear(){ [523,659,784,1047].forEach((f,i) => tone(f, .3, 'triangle', .13, i * .09)); },
    fail(){ [392,330,262].forEach((f,i) => tone(f, .3, 'sine', .12, i * .13)); },
    tap(){ tone(880, .06, 'sine', .07); },
    buy(){ tone(659, .1, 'triangle', .12); tone(988, .16, 'triangle', .1, .07); }
  };
})();

/* ============================================================

      ・おとボタン（state.sound）で SFX といっしょに ON/OFF
      ・画面がかわったら ゆっくり クロスフェード
      ・自動再生がブロックされたら、最初のタップで鳴らしはじめる
   ============================================================ */
const Bgm = (() => {
  const BASE  = 'assets/bgm/';
  const VOL   = { home: .60, play: .50 };  // SFX を埋もれさせないよう控えめに
  const FADE  = 600;                        // ms
  const cache = {};
  let want = null, raf = 0, armed = false, kickUsed = false;

  /* iOS Safari は ogg/vorbis が鳴らないので mp3 に落とす */
  const EXT = (() => {
    const a = document.createElement('audio');
    return (a.canPlayType && a.canPlayType('audio/ogg; codecs="vorbis"')) ? '.ogg' : '.mp3';
  })();

  function el(name){
    let a = cache[name];
    if(!a){
      a = new Audio(BASE + name + EXT);
      a.loop = true; a.preload = 'auto'; a.volume = 0;
      cache[name] = a;
    }
    return a;
  }

  /* 自動再生がブロックされた時：最初の操作で鳴らす */
  function arm(){
    if(armed) return;
    armed = true;
    const on = ev => {
      /* おとボタンは自前で処理する。ここで拾うと
         「pointerdown で鳴らす → click で OFF」になり、押しても無音になる */
      if(ev && ev.target && ev.target.closest && ev.target.closest('.snd')) return;
      armed = false;
      document.removeEventListener('pointerdown', on);
      document.removeEventListener('keydown', on);
      apply();
    };
    document.addEventListener('pointerdown', on);
    document.addEventListener('keydown', on);
  }

  function step(){
    raf = 0;
    const d = 1 / (FADE / 16.7);
    let busy = false;
    Object.keys(cache).forEach(n => {
      const a = cache[n];
      // 再生がブロックされている間は上げない（鳴り出した瞬間に爆音、を防ぐ）
      const target = (state.sound && n === want && !a.paused) ? (VOL[n] || .5) : 0;
      if(Math.abs(a.volume - target) <= d){
        a.volume = target;
        if(target === 0 && !a.paused) a.pause();
      } else {
        a.volume = Math.max(0, Math.min(1, a.volume + (target > a.volume ? d : -d)));
        busy = true;
      }
    });
    if(busy) raf = requestAnimationFrame(step);
  }

  function apply(){
    if(state.sound && want){
      const a = el(want);
      if(a.paused){
        const p = a.play();
        if(p && p.catch) p.catch(() => arm());
      }
    }
    if(!raf) raf = requestAnimationFrame(step);
  }

  return {
    /** 鳴らしたい曲を指定（'home' / 'play'） */
    set(name){ want = name; apply(); },
    /** state.sound を切りかえた後に呼ぶ */
    refresh(){ apply(); },
    /**
     * 「アイコンは🔊なのに、自動再生がブロックされてまだ鳴っていない」状態を
     * 解消する。鳴らしはじめた時だけ true を返す。
     * これで最初の1回は OFF ではなく「鳴らす」になる。
     * 音源が壊れていても押せなくならないよう、消費は1回だけ。
     */
    kick(){
      if(kickUsed || !want) return false;
      const a = cache[want];
      if(a && !a.paused) return false;   // もう鳴っている
      kickUsed = true;
      apply();
      return true;
    },
    /** タブが隠れた時 */
    suspend(){ Object.keys(cache).forEach(n => cache[n].pause()); },
    wake(){ apply(); }
  };
})();

/* ============================================================
   4. 描画ヘルパー（「切り紙」の質感 = 少しずらした影 + フラットな面）
   ============================================================ */
function rr(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function starPath(c, x, y, R, r, n, rot){
  n = n || 5; rot = rot === undefined ? -Math.PI / 2 : rot;
  for(let i = 0; i < n * 2; i++){
    const rad = (i % 2) ? r : R, a = rot + i * Math.PI / n;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}
/** path を描いて「紙を切って置いた」ように影付きで塗る */
function cut(c, path, fill, sx, sy){
  sx = sx === undefined ? 2 : sx; sy = sy === undefined ? 3 : sy;
  if(sx || sy){
    c.save(); c.translate(sx, sy);
    c.fillStyle = 'rgba(58,48,80,.15)';
    c.beginPath(); path(c); c.fill();
    c.restore();
  }
  c.fillStyle = fill;
  c.beginPath(); path(c); c.fill();
}

/* ---------- はいけい ---------- */
function drawBg(c, W, H, id){
  const bg = bgOf(id);
  const g = c.createLinearGradient(0, 0, 0, H);
  bg.sky.forEach(stop => g.addColorStop(stop[0], stop[1]));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if(bg.scene) bg.scene(c, W, H, W / 360);
}
function cloud(c, x, y, r){
  cut(c, cc => {
    cc.arc(x, y, r, 0, 7);
    cc.arc(x + r * .85, y + r * .18, r * .68, 0, 7);
    cc.arc(x - r * .8, y + r * .22, r * .6, 0, 7);
  }, 'rgba(255,255,255,.9)', 0, 0);
}

/* ---------- キャラクター ---------- */
/** x=中心, y=からだの上端, w=からだの幅 */
function drawChar(c, x, y, w, o){
  o = o || {};
  const col = colorOf(o.color || state.equip.color);
  const sh = shapeOf(o.shape === undefined ? state.equip.shape : o.shape);
  const h = w * CHAR_RATIO;
  const ht = hatOf(o.hat === undefined ? state.equip.hat : o.hat);
  const mood = o.mood || 'normal';
  const fx = sh.faceX, fy = h * sh.faceY;   // 形ごとの顔の位置ずらし

  // ぼうし（からだの後ろに来るもの）
  if(ht.back) ht.back(c, x, y, w, col);

  // からだ（形ごとの輪郭）
  sh.body(c, x, y, w, h, col);

  // ほっぺ（形によっては小さく／なし＝おにいさん、おねえさんの顔つきになる）
  if(sh.cheek > 0){
    c.globalAlpha = .5 * sh.cheek; c.fillStyle = '#FF8FA8';
    const cr = w * .085 * sh.cheek, cyy = y + h * .52 + fy;
    c.beginPath(); c.arc(x - w * .3 * fx, cyy, cr, 0, 7); c.fill();
    c.beginPath(); c.arc(x + w * .3 * fx, cyy, cr, 0, 7); c.fill();
    c.globalAlpha = 1;
  }

  // め
  c.fillStyle = '#3A3050';
  const ey = y + h * .37 + fy, ex = w * .19 * fx;
  if(mood === 'sad'){
    c.lineWidth = w * .055; c.strokeStyle = '#3A3050'; c.lineCap = 'round';
    [-1, 1].forEach(s => {
      c.beginPath();
      c.moveTo(x + s * ex - w * .07, ey - w * .05);
      c.lineTo(x + s * ex + w * .07, ey + w * .05);
      c.moveTo(x + s * ex + w * .07, ey - w * .05);
      c.lineTo(x + s * ex - w * .07, ey + w * .05);
      c.stroke();
    });
  } else {
    c.beginPath(); c.arc(x - ex, ey, w * .058, 0, 7); c.fill();
    c.beginPath(); c.arc(x + ex, ey, w * .058, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath(); c.arc(x - ex + w * .022, ey - w * .022, w * .019, 0, 7); c.fill();
    c.beginPath(); c.arc(x + ex + w * .022, ey - w * .022, w * .019, 0, 7); c.fill();
  }

  // くち
  c.strokeStyle = '#3A3050'; c.lineWidth = w * .04; c.lineCap = 'round';
  c.beginPath();
  if(mood === 'sad')      c.arc(x, y + h * .62 + fy, w * .1, Math.PI * 1.18, Math.PI * 1.82);
  else if(mood === 'happy') c.arc(x, y + h * .5 + fy,  w * .13, Math.PI * .12, Math.PI * .88);
  else                      c.arc(x, y + h * .52 + fy, w * .09, Math.PI * .15, Math.PI * .85);
  c.stroke();

  // かご（キャッチする場所）。上級ステージでは せまくなる。
  // 見た目と当たり判定が ずれないよう、charMetrics と同じ計算にすること
  const bs = o.basket === undefined ? 1 : o.basket;
  const bw = w * 1.2 * bs, bh = w * .32, bt = y + h * .70;
  cut(c, cc => rr(cc, x - bw / 2, bt, bw, bh, w * .11), '#F0C48D', 3, 4);
  c.fillStyle = '#DBA466';
  c.beginPath(); rr(c, x - bw / 2, bt, bw, bh * .34, w * .09); c.fill();

  // ぼうし（前面）
  if(ht.draw) ht.draw(c, x, y, w, col);
}

        cc.lineTo(a * .8, 0); cc.lineTo(b, a); cc.lineTo(a, b); cc.lineTo(0, a * .8);

const itemDef  = id => ITEMS.find(i => i.id === id) || ITEMS[0];
const goodPool = n => ITEMS.filter(i => !i.bad && i.from <= n);
/** そのステージで「良いもの1個あたり」に期待できるてん。目標てんの計算に使う */
function ptsPerGood(n){
  const pool = goodPool(n);
  const tot = pool.reduce((s, i) => s + i.weight, 0);
  return pool.reduce((s, i) => s + i.weight * (i.pts || 0), 0) / tot;
}
function drawItem(c, it, R){ itemDef(it.type).draw(c, it.x, it.y, R, it); }

const screens = {
  home:   document.getElementById('s-home'),
  levels: document.getElementById('s-levels'),
  shop:   document.getElementById('s-shop'),
  help:   document.getElementById('s-help'),
  game:   document.getElementById('s-game')
};
let current = 'home';
function go(name){
  if(current === 'game' && name !== 'game') stopGame();
  Object.keys(screens).forEach(k => screens[k].classList.toggle('on', k === name));
  current = name;
  Bgm.set(name === 'game' ? 'play' : 'home');
  if(name === 'home')   renderHome();
  if(name === 'levels') renderLevels();
  if(name === 'shop')   renderShop();
  if(name === 'help')   renderHelp();
}
function refreshCoins(){
  ['homeCoins','lvCoins','shopCoins'].forEach(id => {
    const el = document.getElementById(id); if(el) el.textContent = state.coins;
  });
}
/** 4画面ぶんの おとボタンの見た目をそろえる */
function syncSound(){
  document.querySelectorAll('.snd').forEach(b => {
    b.textContent = state.sound ? '🔊' : '🔇';
    b.setAttribute('aria-label', state.sound ? 'おとを けす' : 'おとを だす');
  });
}

/* ---------- ホーム ---------- */
let bobT = 0, bobRAF = 0;
function renderHome(){
  refreshCoins();
  syncSound();
  cancelAnimationFrame(bobRAF);
  const cv = document.getElementById('homeCv');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const loop = () => {
    bobT += 0.03;
    fitCanvas(cv);
    const c = cv.getContext('2d'), W = cv.clientWidth, H = cv.clientHeight;
    drawBg(c, W, H, state.equip.bg);
    const w = Math.min(W * .42, 148);
    const bob = reduce ? 0 : Math.sin(bobT) * H * .016;
    drawChar(c, W / 2, H * .42 + bob, w, { mood:'happy' });
    if(current === 'home') bobRAF = requestAnimationFrame(loop);
  };
  loop();
}
function fitCanvas(cv){
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  const w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
}

/* ---------- ステージ選択（ロックなし＝いつでもどこでも挑戦できる） ---------- */
function starSvg(on, size){
  return '<svg class="pip" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5 6.2 20.55l1.1-6.5-4.7-4.6 6.5-.95z" fill="' +
    (on ? '#FFC24B' : '#E3DBF0') + '" stroke="' + (on ? '#E39D14' : '#D6CCE8') +
    '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}
function renderLevels(){
  refreshCoins();
  const g = document.getElementById('lvGrid');
  g.innerHTML = '';
  let next = 0;
  for(let n = 1; n <= MAX_LEVEL; n++){ if(!state.stars[n]){ next = n; break; } }
  for(let n = 1; n <= MAX_LEVEL; n++){
    // 区分けの見出し。むずかしさの幅がひろいので目安を出す
    const tier = TIERS.find(x => x.from === n);
    if(tier){
      const h = document.createElement('div');
      h.className = 'tier';
      h.innerHTML = '<b>' + tier.name + '</b><span>' + tier.note + '</span><i></i>';
      g.appendChild(h);
    }
    const st = state.stars[n] || 0;
    const b = document.createElement('button');
    b.className = 'tile' + (st ? ' done' : '') + (n === next ? ' next' : '');
    b.innerHTML = '<span class="n">' + n + '</span><span class="st">' +
      [1,2,3].map(i => starSvg(i <= st, 13)).join('') + '</span>';
    b.setAttribute('aria-label', 'ステージ' + n);
    b.onclick = () => { Sfx.tap(); startGame(n); };
    g.appendChild(b);
  }
}

  /** icon は canvas に描くか、HTML文字列を入れるか */
  const row = (icon, name, note, val, cls) => {
    const r = document.createElement('div'); r.className = 'help-row';
    if(typeof icon === 'string'){
      const d = document.createElement('div'); d.className = 'ic'; d.innerHTML = icon; r.appendChild(d);
    } else {
      const cv = document.createElement('canvas'); r.appendChild(cv);
      requestAnimationFrame(() => {
        const dpr = 2, S = 46;
        cv.width = S * dpr; cv.height = S * dpr;
        const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawItem(c, { type:icon.type, x:S / 2, y:S / 2, spin:0, color:ITEM_COLORS[0] }, S * .36);
      });
    }
    const t = document.createElement('div'); t.className = 't';
    const b = document.createElement('b'); b.textContent = name; t.appendChild(b);
    const s = document.createElement('span'); s.textContent = note; t.appendChild(s);
    r.appendChild(t);
    const v = document.createElement('span'); v.className = 'v' + (cls ? ' ' + cls : '');
    v.textContent = val; r.appendChild(v);
    box.appendChild(r);
  };

  // 説明書は ITEMS から自動で作る。アイテムを足せば ここにも出る
  head('てんに なるもの');
  ITEMS.filter(i => !i.bad && i.pts).forEach(i => row({ type:i.id }, i.name, i.note, i.badge));

  head('とくべつな もの');
  ITEMS.filter(i => !i.bad && !i.pts).forEach(i =>
    row({ type:i.id }, i.name, i.note, i.badge, i.from > 1 ? 'plain' : ''));

  head('きけんな もの');
  ITEMS.filter(i => i.bad).forEach(i => row({ type:i.id }, i.name, i.note, i.badge, 'bad'));

  head('むずかしい ステージの じゃま');
  HAZARDS.forEach(h => row(
    '<svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 14h14a3 3 0 1 1-3 3" fill="none" stroke="#7E7199" stroke-width="2.2" stroke-linecap="round"/></svg>',
    h.name, h.note, h.val, 'plain'));

  head('ルール');
  row(HEART_SVG.repeat(3), 'ハート',
      'バツで へる。0で おしまい', '3こ', 'plain');
  row('<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5 6.2 20.55l1.1-6.5-4.7-4.6 6.5-.95z" fill="#FFC24B" stroke="#E39D14" stroke-width="1.6" stroke-linejoin="round"/></svg>',
      'ほしの かず', 'のこった ハートの かず', '★1〜3', 'plain');
  row('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#57C9A8" stroke-width="2.4"/><path d="M12 6.5V12l3.5 2.2" fill="none" stroke="#57C9A8" stroke-width="2.4" stroke-linecap="round"/></svg>',
      'じかん', 'てんが たまれば すぐ クリア', '45びょう', 'plain');
  row('<svg viewBox="0 0 24 24"><path d="M6 7l12 10M18 7L6 17" stroke="#7E7199" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>',
      'とりのがし', 'へらないので あせらなくて OK', 'セーフ', 'plain');
}

/* ---------- きせかえ ---------- */
let shopCat = CATEGORIES[0].key;

/** タブは CATEGORIES から作る。カテゴリを足せば勝手に増える */
function buildTabs(){
  const wrap = document.getElementById('shopTabs');
  wrap.innerHTML = '';
  CATEGORIES.forEach(g => {
    const b = document.createElement('button');
    b.className = 'tab' + (g.key === shopCat ? ' on' : '');
    b.textContent = g.name;
    b.onclick = () => {
      if(shopCat === g.key) return;
      shopCat = g.key;
      wrap.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
      Sfx.tap();
      renderShop();
      // 前のタブでスクロールした位置が残らないよう、先頭に戻す
      document.getElementById('shopGrid').scrollTop = 0;
    };
    wrap.appendChild(b);
  });
}

function renderShop(){
  refreshCoins();
  drawShopPreview();
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  CAT[shopCat].forEach(item => {
    const owned = state.owned[shopCat].includes(item.id);
    const on = state.equip[shopCat] === item.id;
    const poor = !owned && state.coins < item.price;
    const b = document.createElement('button');
    b.className = 'item' + (on ? ' on' : '') + (owned ? ' owned' : '') + (poor ? ' poor' : '');
    const cv = document.createElement('canvas');
    cv.width = 144; cv.height = 144;
    b.appendChild(cv);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = item.name;
    b.appendChild(nm);
    const pz = document.createElement('span'); pz.className = 'pz';
    pz.innerHTML = owned ? (on ? 'つけてる' : 'もってる') : '<i></i>' + item.price;
    b.appendChild(pz);
    b.onclick = () => pick(item, b);
    grid.appendChild(b);
    requestAnimationFrame(() => drawSwatch(cv, item));
  });
}
function drawSwatch(cv, item){
  const c = cv.getContext('2d');
  const dpr = 2, W = 72, H = 72;
  cv.width = W * dpr; cv.height = H * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  catOf(shopCat).swatch(c, W, H, item);   // 見本の絵はカテゴリが自分で持っている
}
function drawShopPreview(){
  const cv = document.getElementById('shopCv');
  const c = cv.getContext('2d'), dpr = 2, W = 104, H = 104;
  cv.width = W * dpr; cv.height = H * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBg(c, W, H, state.equip.bg);
  drawChar(c, W / 2, H * .3, W * .42, { mood:'happy' });
}
function pick(item, el){
  const owned = state.owned[shopCat].includes(item.id);
  if(owned){
    state.equip[shopCat] = item.id;
    Sfx.tap();
    document.getElementById('shopMsg').textContent = item.name + 'に かえたよ！';
  } else if(state.coins >= item.price){
    state.coins -= item.price;
    state.owned[shopCat].push(item.id);
    state.equip[shopCat] = item.id;
    Sfx.buy();
    document.getElementById('shopMsg').textContent = item.name + 'を かった！';
  } else {
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    document.getElementById('shopMsg').textContent =
      'コインが あと ' + (item.price - state.coins) + 'こ。ステージで あつめよう！';
    return;
  }
  save(); renderShop();
}

/* ============================================================
   6. ゲーム本体
   ============================================================ */
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
let bgCache = null, bgKey = '';

const G = {
  on:false, raf:0, last:0,
  level:1, params:null,
  W:0, H:0,
  charX:0, targetX:0,
  items:[], pops:[],
  score:0, lives:3, time:0,
  spawnT:0, hurtUntil:0,
  shield:false, x2Until:0, magnetUntil:0,    // アイテムの効果
  fxT:0, fxOn:false,                         // 効果表示の更新用
  windPhase:0, clouds:[],                    // じゃま
  countdown:0, coinsGot:0,
  startedMoving:false, ended:false
};

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  const r = cv.getBoundingClientRect();
  G.W = r.width; G.H = r.height;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgCache = null;
}
addEventListener('resize', () => { if(G.on) resize(); });

function charMetrics(){
  const w = Math.max(56, Math.min(100, G.W * .21));
  const h = w * CHAR_RATIO;   // drawChar と同じ値。かたちを変えても判定は動かない
  const top = G.H * .745;                   // 画面下から約20%上 = 親指でキャラが隠れない
  // かごの幅は ステージで変わる。drawChar の bw と 同じ式にしてある
  const bs = G.params ? G.params.basket : 1;
  return { w:w, h:h, top:top, catch:top + h * .70, bw:w * 1.2 * bs, bh:w * .32 };
}

function startGame(n){
  G.level = n;
  const assist = (state.fails[n] || 0) >= 3;
  G.params = levelParams(n, assist);
  go('game');
  resize();
  G.items = []; G.pops = [];
  G.score = 0; G.lives = 3; G.time = G.params.time;
  G.spawnT = 0; G.hurtUntil = 0;
  G.shield = false; G.x2Until = 0; G.magnetUntil = 0;
  G.windPhase = Math.random() * 6.28;
  G.clouds = [];
  for(let i = 0; i < G.params.clouds; i++){
    const dir = i % 2 ? 1 : -1;
    G.clouds.push({
      x: G.W * (i + .5) / Math.max(1, G.params.clouds),
      y: cloudY(),
      r: G.W * (.11 + Math.random() * .04),
      vx: dir * (.035 + Math.random() * .025)
    });
  }
  G.coinsGot = 0; G.ended = false;
  G.startedMoving = false;
  G.countdown = 2.0;
  G.charX = G.W / 2; G.targetX = G.W / 2;
  document.getElementById('ov').classList.remove('on');
  updateHud();
  Sfx.unlock();
  G.on = true; G.last = performance.now();
  cancelAnimationFrame(G.raf);
  G.raf = requestAnimationFrame(tick);
}
function stopGame(){ G.on = false; cancelAnimationFrame(G.raf); }

/* ---------- 入力：画面のどこでも指の左右位置にキャラが付いてくる ---------- */
function pointTo(e){
  const r = cv.getBoundingClientRect();
  const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const m = charMetrics();
  G.targetX = Math.max(m.bw / 2 + 4, Math.min(G.W - m.bw / 2 - 4, px));
  if(!G.startedMoving){ G.startedMoving = true; state.tutorialDone = true; save(); }
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pointTo(e); Sfx.unlock(); });
cv.addEventListener('pointermove', e => { if(e.pressure > 0 || e.buttons || e.pointerType === 'touch') pointTo(e); });
cv.addEventListener('touchstart', e => e.preventDefault(), { passive:false });
cv.addEventListener('touchmove',  e => e.preventDefault(), { passive:false });
addEventListener('keydown', e => {
  if(!G.on) return;
  const m = charMetrics(), step = G.W * .09;
  if(e.key === 'ArrowLeft'){ G.targetX = Math.max(m.bw / 2 + 4, G.targetX - step); G.startedMoving = true; }
  if(e.key === 'ArrowRight'){ G.targetX = Math.min(G.W - m.bw / 2 - 4, G.targetX + step); G.startedMoving = true; }
});

/* ---------- スポーン ---------- */
/** そのステージで でてくる ものから、重みつきで1つ選ぶ */
function pickType(){
  const p = G.params;
  if(Math.random() < p.bad) return 'bad';
  const pool = goodPool(G.level);
  let r = Math.random() * pool.reduce((s, i) => s + i.weight, 0);
  for(const i of pool){ r -= i.weight; if(r <= 0) return i.id; }
  return pool[0].id;
}
function spawnOne(){
  const p = G.params, R = itemR(), pad = R * 1.6;
  G.items.push({
    type: pickType(),
    x: pad + Math.random() * (G.W - pad * 2),
    y: -R * 1.4,
    vy: p.speed * G.H * (.92 + Math.random() * .16),
    spin: Math.random() * 6.28,
    color: ITEM_COLORS[(Math.random() * ITEM_COLORS.length) | 0]
  });
}
function spawn(){
  // じゃま「むれ」: たまに まとめて おちてくる
  const n = (G.params.burst && Math.random() < G.params.burst) ? 3 : 1;
  for(let i = 0; i < n; i++) spawnOne();
}
function itemR(){ return Math.max(13, Math.min(25, G.W * .053)); }
/** じゃまのくもが うかぶ たかさ。HUD と かごの あいだに おさめる */
function cloudY(){ return G.H * (.30 + Math.random() * .26); }

/* ---------- ループ ---------- */
function tick(now){
  if(!G.on) return;
  const dt = Math.min(.05, (now - G.last) / 1000);
  G.last = now;
  update(dt);
  render(now / 1000);
  G.raf = requestAnimationFrame(tick);
}

function update(dt){
  const m = charMetrics(), R = itemR();

  // なめらかに追従（フレームレートに依存しない補間）
  const k = 1 - Math.pow(0.0009, dt);
  G.charX += (G.targetX - G.charX) * k;

  if(G.countdown > 0){ G.countdown -= dt; return; }
  if(G.ended) return;

  G.time -= dt;
  if(G.time <= 0){ G.time = 0; finish(false); return; }

  G.spawnT -= dt;
  if(G.spawnT <= 0){ spawn(); G.spawnT = G.params.spawn * (.85 + Math.random() * .3); }

  const t = now();
  const magnet = t < G.magnetUntil;

  // 効果の のこり秒を出すため、効果中は こまめに HUD を更新する
  const anyFx = G.shield || t < G.x2Until || magnet;
  if((anyFx || G.fxOn) && t - G.fxT > .2){ G.fxT = t; G.fxOn = anyFx; updateHud(); }
  // じゃま「かぜ」: ゆっくり むきが かわる横風
  G.windPhase += dt * .45;
  const wind = G.params.wind ? Math.sin(G.windPhase) * G.params.wind * G.W : 0;
  const hom  = G.params.homing;

  for(let i = G.items.length - 1; i >= 0; i--){
    const it = G.items[i];
    const prevBottom = it.y + R;
    it.y += it.vy * dt;
    it.spin += dt * 1.6;

    const isBad = itemDef(it.type).bad;
    if(wind) it.x += wind * dt;
    // マグネット: 良いものだけ よこから よってくる
    if(magnet && !isBad) it.x += (G.charX - it.x) * Math.min(1, dt * 2.6);
    // じゃま「おいかけ」: 上級では バツが すこし よってくる（逃げれば かわせる強さ）
    if(hom && isBad)     it.x += (G.charX - it.x) * Math.min(1, dt * hom * 3);
    it.x = Math.max(R * .6, Math.min(G.W - R * .6, it.x));

    const bottom = it.y + R;
    // かごを通過した瞬間だけ判定（すり抜け防止）
    const inX = Math.abs(it.x - G.charX) <= m.bw / 2 + R * .45;
    if(inX && prevBottom < m.catch && bottom >= m.catch){
      G.items.splice(i, 1);
      onCatch(it, m);
      continue;
    }
    if(it.y - R > G.H + 20) G.items.splice(i, 1);   // とりのがしても ペナルティなし
  }

  // じゃま「くも」: 画面を よこぎって おちてくるものを かくす
  for(const cl of G.clouds){
    cl.x += cl.vx * dt * G.W;
    if(cl.vx > 0 && cl.x - cl.r * 2 > G.W) { cl.x = -cl.r * 2; cl.y = cloudY(); }
    if(cl.vx < 0 && cl.x + cl.r * 2 < 0)   { cl.x = G.W + cl.r * 2; cl.y = cloudY(); }
  }

  for(let i = G.pops.length - 1; i >= 0; i--){
    const p = G.pops[i];
    p.t += dt; p.y -= dt * G.H * .09;
    if(p.t > .85) G.pops.splice(i, 1);
  }
}

function onCatch(it, m){
  const px = it.x, py = m.catch - 10;
  const def = itemDef(it.type);

  if(def.bad){
    if(G.shield){                      // バリアが 1かい ふせぐ
      G.shield = false;
      Sfx.slow();
      G.pops.push({ x:px, y:py, t:0, txt:'まもった！' });
      updateHud();
      return;
    }
    G.lives--;
    G.hurtUntil = now() + .7;
    Sfx.hit();
    G.pops.push({ x:px, y:py, t:0, txt:'', bad:true });
    if(navigator.vibrate) try { navigator.vibrate(40); } catch(e){}
    updateHud();
    if(G.lives <= 0){ finish(false); }
    return;
  }

  let txt = '';
  if(def.pts){
    const v = def.pts * (now() < G.x2Until ? 2 : 1);   // 2ばい中は てんが 2ばい
    G.score += v;
    txt = '+' + v;
    def.id === 'star' ? Sfx.star() : Sfx.catch_();
  }
  if(def.hit) txt = def.hit() || txt;
  G.pops.push({ x:px, y:py, t:0, txt:txt, coin:def.id === 'coin' });

  updateHud();
  if(G.score >= G.params.goal) finish(true);
}

/* ---------- HUD ---------- */
function updateHud(){
  const hs = document.getElementById('hearts');
  if(hs.childElementCount !== 3){
    hs.innerHTML = [0,1,2].map(() =>
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.4-4.6-9.3-9.1C1.2 8.1 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 5.8 3.6 4.3 7.4C19.4 16.4 12 21 12 21z" fill="#F2637E" stroke="#CE4260" stroke-width="1.5" stroke-linejoin="round"/></svg>'
    ).join('');
  }
  [...hs.children].forEach((el, i) => el.classList.toggle('off', i >= G.lives));

  const tb = document.getElementById('timeBar');
  const ratio = G.params ? G.time / G.params.time : 1;
  tb.firstElementChild.style.width = Math.max(0, ratio * 100) + '%';
  tb.classList.toggle('low', ratio < .25);

  const goal = G.params ? G.params.goal : 1;
  document.getElementById('goalFill').style.width = Math.min(100, G.score / goal * 100) + '%';
  document.getElementById('goalNum').textContent = Math.min(G.score, goal) + ' / ' + goal;

  // いま効いている効果を出す（何が起きているか わかるように）
  const fx = document.getElementById('fxRow');
  const t = now(), on = [];
  if(G.shield)         on.push(['s', 'バリア']);
  if(t < G.x2Until)    on.push(['d', '×2 ' + Math.ceil(G.x2Until - t)]);
  if(t < G.magnetUntil)on.push(['m', 'ひきよせ ' + Math.ceil(G.magnetUntil - t)]);
  fx.hidden = on.length === 0;
  fx.innerHTML = on.map(o => '<span class="' + o[0] + '">' + o[1] + '</span>').join('');
}

/* ---------- 描画 ---------- */
function render(t){
  const m = charMetrics(), R = itemR();
  const key = state.equip.bg + '|' + Math.round(G.W) + 'x' + Math.round(G.H);
  if(!bgCache || bgKey !== key){
    bgCache = document.createElement('canvas');
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    bgCache.width = Math.round(G.W * dpr); bgCache.height = Math.round(G.H * dpr);
    const bc = bgCache.getContext('2d');
    bc.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBg(bc, G.W, G.H, state.equip.bg);
    bgKey = key;
  }
  cx.drawImage(bgCache, 0, 0, G.W, G.H);

  G.items.forEach(it => drawItem(cx, it, R));

  const hurt = t < G.hurtUntil;
  const shake = hurt ? Math.sin(t * 60) * 3 : 0;
  cx.save(); cx.translate(shake, 0);
  drawChar(cx, G.charX, m.top, m.w, {
    mood: hurt ? 'sad' : (G.score >= (G.params ? G.params.goal : 1) ? 'happy' : 'normal'),
    basket: G.params ? G.params.basket : 1
  });
  // バリア中は キャラを わっかで囲む
  if(G.shield){
    cx.strokeStyle = 'rgba(87,201,168,.85)';
    cx.lineWidth = Math.max(3, m.w * .06);
    cx.beginPath();
    cx.ellipse(G.charX, m.top + m.h * .52, m.w * .82, m.h * .95, 0, 0, 7);
    cx.stroke();
  }
  // マグネット中は ひきよせている感じを出す
  if(t < G.magnetUntil){
    cx.strokeStyle = 'rgba(242,99,126,.35)';
    cx.lineWidth = 3;
    for(let i = 1; i <= 2; i++){
      const rr2 = m.w * (.9 + i * .45) + Math.sin(t * 4 + i) * 4;
      cx.beginPath(); cx.arc(G.charX, m.catch, rr2, Math.PI * 1.12, Math.PI * 1.88); cx.stroke();
    }
  }
  cx.restore();

  // じゃま「くも」: おちてくるものの手前に描いて かくす
  G.clouds.forEach(cl => {
    // 完全には隠さない。うっすら影が見えるので「そこに何かある」は分かる
    cx.globalAlpha = .80;
    cut(cx, c => {
      c.arc(cl.x, cl.y, cl.r, 0, 7);
      c.arc(cl.x + cl.r * .85, cl.y + cl.r * .18, cl.r * .68, 0, 7);
      c.arc(cl.x - cl.r * .8, cl.y + cl.r * .22, cl.r * .6, 0, 7);
    }, '#FFFFFF', 0, 0);
    cx.globalAlpha = 1;
  });

  // ふきだし（+1 など）
  G.pops.forEach(p => {
    const a = 1 - p.t / .85;
    cx.globalAlpha = Math.max(0, a);
    if(p.bad){
      cx.strokeStyle = '#CE4260'; cx.lineWidth = 5; cx.lineCap = 'round';
      const s = 12 + p.t * 20;
      cx.beginPath();
      cx.moveTo(p.x - s, p.y - s); cx.lineTo(p.x + s, p.y + s);
      cx.moveTo(p.x + s, p.y - s); cx.lineTo(p.x - s, p.y + s);
      cx.stroke();
    } else {
      cx.font = '800 ' + Math.round(G.W * .058) + "px 'M PLUS Rounded 1c', system-ui, sans-serif";
      cx.textAlign = 'center';
      cx.lineWidth = 5; cx.strokeStyle = 'rgba(255,255,255,.9)';
      cx.strokeText(p.txt, p.x, p.y);
      cx.fillStyle = p.coin ? '#E39D14' : '#3A3050';
      cx.fillText(p.txt, p.x, p.y);
    }
    cx.globalAlpha = 1;
  });

  // はじめての人むけ：ゆびのヒント（動かしたら消える）
  if(!G.startedMoving && G.countdown <= 0 && !state.tutorialDone){
    const hx = G.W / 2 + Math.sin(t * 1.9) * G.W * .27;
    const hy = m.top + m.h * 1.5;
    cx.globalAlpha = .9;
    cut(cx, c => c.arc(hx, hy, G.W * .045, 0, 7), '#FFFDFA', 2, 3);
    cx.fillStyle = '#3A3050';
    cx.beginPath(); cx.arc(hx, hy, G.W * .018, 0, 7); cx.fill();
    cx.globalAlpha = 1;
  }

  // 3-2-1
  if(G.countdown > 0){
    cx.fillStyle = 'rgba(58,48,80,.3)'; cx.fillRect(0, 0, G.W, G.H);
    const n = Math.ceil(G.countdown / (2 / 3));
    const label = n >= 3 ? '3' : n === 2 ? '2' : '1';
    const grow = 1 + (1 - (G.countdown % (2 / 3)) / (2 / 3)) * .35;
    cx.save();
    cx.translate(G.W / 2, G.H * .42); cx.scale(grow, grow);
    cx.font = "800 " + Math.round(G.W * .3) + "px 'M PLUS Rounded 1c', system-ui, sans-serif";
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.lineWidth = 12; cx.strokeStyle = '#FFFDFA'; cx.strokeText(label, 0, 0);
    cx.fillStyle = '#3A3050'; cx.fillText(label, 0, 0);
    cx.restore();
  }
}

/* ---------- 終了 ---------- */
function finish(cleared){
  if(G.ended) return;
  G.ended = true; G.on = false;
  cancelAnimationFrame(G.raf);

  let gift = null, earned = 0, stars = 0;

  if(cleared){
    stars = Math.max(1, G.lives);
    const prev = state.stars[G.level] || 0;
    const first = prev === 0;
    earned = 8 + G.level * 2 + stars * 4 + G.coinsGot + (first ? 15 : 0);
    if(stars > prev) state.stars[G.level] = stars;
    state.fails[G.level] = 0;
    state.coins += earned;
    // 初クリアのごほうび：「持っている」体験を先につくる
    if(!state.giftGiven){
      state.giftGiven = true;
      if(!state.owned.hat.includes('ribbon')){
        state.owned.hat.push('ribbon');
        state.equip.hat = 'ribbon';
        gift = HATS.find(h => h.id === 'ribbon');
      }
    }
    Sfx.clear();
  } else {
    state.fails[G.level] = (state.fails[G.level] || 0) + 1;
    earned = G.coinsGot;
    state.coins += earned;
    Sfx.fail();
  }
  save();
  showResult(cleared, stars, earned, gift);
}

function showResult(cleared, stars, earned, gift){
  const ov = document.getElementById('ov');
  document.getElementById('ovTitle').textContent = cleared ? 'クリア！' : 'ざんねん…';
  document.getElementById('ovCoins').textContent = '+' + earned;

  const sw = document.getElementById('ovStars');
  sw.innerHTML = cleared
    ? [1,2,3].map(i => '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.5 6.2 20.55l1.1-6.5-4.7-4.6 6.5-.95z" fill="' +
        (i <= stars ? '#FFC24B' : '#E9E1F4') + '" stroke="' + (i <= stars ? '#E39D14' : '#DCD2EC') +
        '" stroke-width="1.6" stroke-linejoin="round"/></svg>').join('')
    : '';

  const oc = document.getElementById('ovCv');
  const c = oc.getContext('2d'), dpr = 2, W = 112, H = 112;
  oc.width = W * dpr; oc.height = H * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBg(c, W, H, state.equip.bg);
  drawChar(c, W / 2, H * .3, W * .44, { mood: cleared ? 'happy' : 'sad' });

  const gEl = document.getElementById('ovGift');
  if(gift){
    gEl.hidden = false;
    document.getElementById('giftName').textContent = gift.name;
    const gc = document.getElementById('giftCv');
    const g2 = gc.getContext('2d');
    gc.width = 52 * dpr; gc.height = 52 * dpr;
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBg(g2, 52, 52, state.equip.bg);
    drawChar(g2, 26, 15, 24, { hat:gift.id, mood:'happy' });
  } else gEl.hidden = true;

  const main = document.getElementById('ovMain');
  if(cleared && G.level < MAX_LEVEL){
    main.textContent = 'つぎへ';
    main.onclick = () => { Sfx.tap(); startGame(G.level + 1); };
  } else if(cleared){
    main.textContent = 'ステージを えらぶ';
    main.onclick = () => { Sfx.tap(); go('levels'); };
  } else {
    main.textContent = 'もういちど';
    main.onclick = () => { Sfx.tap(); startGame(G.level); };
  }
  ov.classList.add('on');
}

/* ============================================================
   7. ボタン
   ============================================================ */
document.getElementById('btnPlay').onclick     = () => { Sfx.unlock(); Sfx.tap(); go('levels'); };
document.getElementById('btnShop').onclick     = () => { Sfx.tap(); go('shop'); };
document.getElementById('btnLvBack').onclick   = () => { Sfx.tap(); go('home'); };
document.getElementById('btnShopBack').onclick = () => { Sfx.tap(); go('home'); };
document.getElementById('btnHelp').onclick     = () => { Sfx.tap(); go('help'); };
document.getElementById('btnHelpBack').onclick = () => { Sfx.tap(); go('home'); };
document.getElementById('btnQuit').onclick     = () => { Sfx.tap(); go('levels'); };
document.getElementById('ovHome').onclick      = () => { Sfx.tap(); document.getElementById('ov').classList.remove('on'); go('home'); };
/* おとボタンは4画面すべてに置いてある。どれを押しても同じ動きをして、
   表示は全部いっしょに切りかわる */
document.querySelectorAll('.snd').forEach(b => {
  b.onclick = () => {
    // 🔊 のまま まだ鳴っていない時は、OFF にせず「鳴らす」だけにする
    if(state.sound && Bgm.kick()){ Sfx.tap(); return; }
    state.sound = !state.sound; save();
    syncSound();
    Bgm.refresh();
    if(state.sound) Sfx.tap();
  };
});
addEventListener('keydown', e => {
  if(e.key === 'Escape' && current === 'game') go('levels');
});
/* よこ向きの間は あんないを かぶせるので、その裏で ゲームを進めない。
   進めてしまうと 操作できないのに アイテムが落ち続けて 理不尽に負ける */
const rotateMQ = matchMedia('(orientation:landscape) and (max-height:520px)');

function resumeGame(){
  if(current !== 'game' || G.ended || G.on) return;
  resize();                                   // 画面サイズが変わっている場合がある
  const m = charMetrics(), lo = m.bw / 2 + 4, hi = G.W - m.bw / 2 - 4;
  G.charX   = Math.max(lo, Math.min(hi, G.charX));
  G.targetX = Math.max(lo, Math.min(hi, G.targetX));
  G.on = true; G.last = performance.now();
  cancelAnimationFrame(G.raf);
  G.raf = requestAnimationFrame(tick);
}
function onOrient(){
  if(rotateMQ.matches){
    Bgm.suspend();
    if(G.on) stopGame();
  } else {
    Bgm.wake();
    resumeGame();
  }
}
if(rotateMQ.addEventListener) rotateMQ.addEventListener('change', onOrient);
else if(rotateMQ.addListener)  rotateMQ.addListener(onOrient);   // 古いSafari用
addEventListener('resize', onOrient);          // 回転で change が来ない端末の保険

document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    Bgm.suspend();
    if(G.on) stopGame();
  } else {
    Bgm.wake();
    if(!rotateMQ.matches) resumeGame();
  }
});

/* ============================================================
   8. ホーム画面アイコンを その場で生成
      （顔をドアップ＋落下物ひとつ＝小さいサイズでも識別できる案）
   ============================================================ */
function makeIcon(){
  try {
    const S = 192;
    const cvi = document.createElement('canvas');
    cvi.width = S; cvi.height = S;
    const c = cvi.getContext('2d');
    c.fillStyle = '#FFC24B'; c.fillRect(0, 0, S, S);
    cut(c, cc => cc.arc(S * .74, S * .22, S * .09, 0, 7), '#57C9A8', 3, 4);
    const col = colorOf(state.equip.color);
    const w = S * .62, x = S * .46, y = S * .34, h = w * .86;
    cut(c, cc => rr(cc, x - w / 2, y, w, h, w * .32), col.hex, 4, 6);
    c.fillStyle = '#3A3050';
    c.beginPath(); c.arc(x - w * .19, y + h * .37, w * .06, 0, 7); c.fill();
    c.beginPath(); c.arc(x + w * .19, y + h * .37, w * .06, 0, 7); c.fill();
    c.strokeStyle = '#3A3050'; c.lineWidth = w * .045; c.lineCap = 'round';
    c.beginPath(); c.arc(x, y + h * .5, w * .13, Math.PI * .12, Math.PI * .88); c.stroke();
    const url = cvi.toDataURL('image/png');
    [['apple-touch-icon'], ['icon']].forEach(([rel]) => {
      const l = document.createElement('link');
      l.rel = rel; l.href = url; l.sizes = '192x192';
      document.head.appendChild(l);
    });
  } catch(e){}
}

/* ============================================================
   9. スタート
   ============================================================ */
makeIcon();
buildTabs();
syncSound();
go('home');
